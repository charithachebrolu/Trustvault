# Free Render Blueprint for a same-origin frontend + FastAPI demo.
# The filesystem is temporary: the database and uploaded files can disappear
# whenever Render restarts or redeploys this free service.
services:
  - type: web
    name: trustvault-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TRUSTVAULT_SECRET_KEY
        generateValue: true
      - key: TRUSTVAULT_ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: TRUSTVAULT_DATABASE_PATH
        value: /tmp/trustvault.db
      - key: TRUSTVAULT_STORAGE_DIR
        value: /tmp/trustvault-uploads
      - key: TRUSTVAULT_COOKIE_SECURE
        value: "true"
      - key: TRUSTVAULT_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: TRUSTVAULT_SESSION_HOURS
        value: "8"
